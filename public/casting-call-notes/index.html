<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Casting Call Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#dfe2e8;--pg:#fbfbfc;--ink:#14161b;--mut:#5d6370;--ln:#dcdfe5;--hl:#ffe98a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0c0f;--pg:#171a20;--ink:#eef0f4;--mut:#9aa1ae;--ln:#2d323b;--hl:#5b4a08}}
:root[data-theme=dark]{--bg:#0b0c0f;--pg:#171a20;--ink:#eef0f4;--mut:#9aa1ae;--ln:#2d323b;--hl:#5b4a08}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
h1,h2,h3,blockquote{font-family:Fraunces,Georgia,serif;margin:0}
.pg{background:var(--pg);max-width:794px;margin:16px auto;padding:44px 48px;min-height:1000px;position:relative;border-top:12px solid var(--a,#14161b);overflow:hidden;box-sizing:border-box}
.cv{display:flex;flex-direction:column;justify-content:flex-end;padding:0;border:0}
.cv .im{position:absolute;inset:0 0 auto;width:100%;height:62%;object-fit:cover;object-position:50% 60%}.bars{display:flex;height:14px;position:absolute;inset:62% 0 auto}.bars i{flex:1}
.cv .t{position:relative;padding:40px 48px;background:var(--pg);margin-top:auto;height:38%;box-sizing:border-box}
.cv h1{font-size:64px;line-height:1;font-weight:800}.cv p{color:var(--mut);margin:14px 0 0}
h2{font-size:34px;font-weight:800;line-height:1.1}
.mo{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--a);color:var(--t,#fff);font:800 30px Fraunces,Georgia,serif;flex:none}
.hd{display:flex;gap:18px;align-items:center;margin-bottom:18px}.hd p{margin:4px 0 0;color:var(--mut)}
.ch{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;background:var(--ln);margin:0 8px 2px 0}
.ct{margin:0 0 6px;font-weight:600}
.s{border-left:3px solid var(--a);padding:2px 0 2px 14px;margin:16px 0}
.s h4{margin:0 0 2px;font-size:13px;color:var(--mut);font-weight:600}.s p{margin:0}
.sw{display:flex;align-items:center;gap:10px}.sw i{width:26px;height:26px;border-radius:50%;border:1px solid var(--ln)}
blockquote{font-size:23px;line-height:1.3;font-weight:500;margin:26px 0 14px;padding:14px 0;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
audio{width:100%}.pn{display:none}.slot{border:1px dashed var(--ln);padding:8px 12px;color:var(--mut)}
.tr{display:none;border:1px dashed var(--mut);padding:8px;margin-top:6px;color:var(--mut)}
.ft{position:absolute;right:48px;bottom:26px;font-size:12px;color:var(--mut)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.cd{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;padding:12px;border:1px solid var(--ln);border-left:6px solid var(--a);border-radius:6px}
.cd .mo{width:44px;height:44px;font-size:20px}.cd h3{font-size:18px}.cd small{margin-left:8px;color:var(--mut);font:400 13px Inter}.cd p{margin:0;font-size:13px;color:var(--mut)}
.wg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.w{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--ln);border-radius:6px}.w>b{font:800 22px Fraunces,Georgia,serif;min-width:32px;color:var(--mut)}.w p{margin:0}.w i{color:var(--mut)}
.bar{display:flex;align-items:center;gap:10px;margin:4px 0;font-size:13px}.bar span{width:90px}.bar u{display:block;height:10px;background:#2f5bff;border-radius:5px;text-decoration:none}
.u{background:transparent}body.rv .u{background:var(--hl);border-bottom:2px solid #d99a00}body.rv .tr{display:block}
.tb{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:9;display:flex;gap:8px}
.tb button{font:600 13px Inter,sans-serif;padding:8px 12px;border-radius:99px;border:1px solid var(--ln);background:var(--pg);color:var(--ink)}
.gl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.gl img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block}.gl.hero figure:first-child{grid-column:1/-1}.gl.hero img{aspect-ratio:1}.gl.hero figure:first-child img{aspect-ratio:16/9}figure{margin:0}figcaption{font-size:12px;color:var(--mut);margin-top:3px}.pf{margin:0 0 0 auto;text-align:right}.pf img{width:110px;height:110px;object-fit:cover;border-radius:8px;display:block}.vp button{font:600 14px Inter,sans-serif;padding:10px 18px;border-radius:99px;border:0;background:var(--a);color:var(--t,#fff);cursor:pointer}.al{margin:10px 0 0}.al a{font-weight:600;color:var(--ink)}.al small{color:var(--mut)}@media(max-width:640px){.gl{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.pg{padding:26px 18px;margin:8px 0;min-height:0}.cv{min-height:90vh}.cv .t{padding:26px 18px}.cv h1{font-size:46px}.gr,.wg{grid-template-columns:1fr}.ft{position:static;display:block;margin-top:16px}}
@media print{:root:root{--bg:#fff;--pg:#fff;--ink:#14161b;--mut:#5d6370;--ln:#dcdfe5}@page{size:A4;margin:0}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.pg{margin:0;width:210mm;height:297mm;min-height:0;max-width:none;break-after:page;page-break-after:always}.np,.tb,audio,.slot,.tr{display:none!important}.pn{display:block;color:var(--mut)}.u{background:none!important;border:0!important}}
</style></head><body>
<div class="tb np"><button id="rv">Review mode</button><button onclick="print()">Save as PDF</button></div>
<main id="app"></main>
<script>
const AU={dhillon:"audio/dhillon.m4a",jasim:"audio/jasim.m4a",evelyn:"audio/evelyn.m4a"};const I={i145:"photos/145.jpg",i146:"photos/146.jpg",i147:"photos/147.jpg",i149:"photos/149.jpg",i150:"photos/150.jpg",i152:"photos/152.jpg",i157:"photos/157.jpg",i159:"photos/159.jpg",i160:"photos/160.jpg",i161:"photos/161.jpg",i164:"photos/164.jpg",i166:"photos/166.jpg",i167:"photos/167.jpg"};
const P=[
{id:"kancy",n:"Kancy",a:24,c:"#2f5bff",h:"Content creator, looking for a job",q:"Loves what she does.",col:["Blue – very positive, for energy","#2f5bff"],S:[["Why here",`Curious – [[here for a month, not here next week]].`],["About",`Content creator, [[IT]] Insta. Looking for a job.`],["Why content creation",`[[Shows herself online, seen so before.]] Good at slaying. Loves what she does.`],["Notes",`Trainers (very cool). PLT collab (very cool).`]]},
{id:"uyi",n:"Uyi",c:"#7b5cff",h:"Dabbles in modelling, not much experience",q:"This guy is an enigma.",S:[["Why here",`Dabbles in modelling – not much experience.`],["Enigma",`Resonates – maybe that doesn’t fit. He felt he wouldn’t fit in that culture: very mixed culture, and no culture / all culture. This guy is an enigma.`],["Fit",`Interesting outfit [[that can get positive reactions]]. Brought a change of clothes + bling – kitted up, planned for it.`],["Love or Pride",`Love is the easy answer (love is shown as amazing). Pride is more negative – ego, narcissist. Love can be bad – you can love too hard. Pride is good sometimes. Pride is essential to identity. [[Selfless – friend.]] The answer is love – a give.`],["Last thing you created",`An application ([[limit order book]]). Quant dev stuff, high performance compute – was fun.`]]},
{id:"marques",n:"Marques",a:17,c:"#e4572e",h:"Ring leader – owns a community",q:"Built a platform – people need models, mutually.",S:[["Who he is",`Owns a community – pro model. Helps people get into the industry for free; [[brings 5 people]].`],["Enigma",`Modelling is the [[outlet to the outside]] – the more you get to be yourself, the more empowered.`],["Why is he doing this",`Built a platform in his community – people need models, mutually. Good person.`],["What would you change",`Organisation – let people know what’s happening, better; handle communication better at the time.`]]},
{id:"olivia",n:"Olivia",c:"#d6336c",h:"From Finland, based in London",q:"Joyful, uplifting, light energy.",k:["WhatsApp [[+44 7752 628145]]","From Finland, based in London"],S:[["Why here",`Intuition – destiny. Industry [[been cracked]], ready to enter.`],["Vibes and energy",`Friends say: joyful, uplifting, light energy – fairy energy. We are all multi-dimensional – [[both people can’t be limited]].`],["Tell me about your bag",`Corp sales job (Nordic) · [[Kurt Geiger]] · got 3 bags.`],["Favourite bag",`[[Natalie]] – her very, very cool gangster bag.`]]},
{id:"perianna",n:"Perianna",a:17,c:"#9b5de5",h:"Painter and team player",q:"Her work comes off the back of her eyelids.",S:[["Why here",`Likes modelling – creative outlet, [[at student]]. Contemporary; seems cool, good vibe.`],["Enigma",`Hates categories – everyone is a free thinker. Changes mind on opinion.`],["Creativity",`Painter – exploring colour, finding her style. Meditation-based: her work comes off the back of her eyelids. Very creative. Team player.`],["About colour",`Wearing all black today because she was told to – not her favourite colour. [[Felt annoyed without colour.]] Loving colour. Very interesting – [[associates with colours]].`]]},
{id:"dhillon",n:"Dhillon",a:17,c:"#17a398",h:"30k followers, content streamer",q:"Love is the one strong word with a lot of power.",k:["07862 350278","Instagram: [[@dhillvnn]]"],v:1,d:"0:35",ph:["i149","With Akash"],S:[["Why here",`New to a fashion sense. Modelled before, more high end. Streetwear is [[capitalist]] – wants more meaning in his model work.`],["Enigma",`Government and education force everyone into a box – the system is boxy. 30k followers on social media; blocked all his friends – stepping out of line. This guy is an enigma. More modelling – content streamer.`],["Love or Pride",`Very distinct – (“opposites” crossed out) heavily linked. Pride is loving something. Pride is [[heavily connected]] + LGBTQ. Love is the one strong word with a lot of power.`],["A note to myself",`What do I miss?`]]},
{id:"arlo",n:"Arlo",a:17,c:"#2a9df4",h:"Scouted – sociable, sports",q:"Every day is a new mystery.",k:["arlo.a.anderson@gmail.com"],S:[["Why here",`Friend from school, interested, been scouted.`],["Enigma",`It is just life – every day is a new mystery. Feels it in his life; love an [[excursion]].`],["After school",`Travel the world – ski, Canada, Asia, Australia.`],["Creativity (outside the box)",`Sociable, sports – loves it.`],["What do you want to tell me",`Modelling path – find out more, planning for that kind of life.`]]},
{id:"kevin",n:"Kevin",a:16,c:"#6a8f3a",h:"First time – loves all art",q:"It is what you think it is.",ph:["i161","With Ivy"],S:[["Why here",`Networking, first time, environment vibes. Wants to learn, do everything.`],["Enigma",`Ghetto area, and has to flip a lot – extro and intro. It is what you think it is.`],["How often do you get a trim",`Once a month – costs money. Gotta go in [[silence]]; cares and doesn’t care at the same time. Wants to look good when it matters.`],["Creativity",`Photography at school opened him up to ideas. Loves all art – takes whatever he can see.`],["Explorer",`Coding, CS – everything.`],["How did you find it",`Would come again – the people are so great. “I will do it more.”`]]},
{id:"evelyn",n:"Evelyn",c:"#f2b705",t:"#14161b",h:"Escaping work – fashion and music",q:"Bring my energy with me.",col:["Yellow – people struggle to understand its potential; bright, but doesn’t always fit in","#f2b705"],v:1,d:"0:30",S:[["Why here",`An escape from work, getting in touch with people and a new vibe.`],["Creativity",`Fashion – and now speaks her mind. Create my space and music, bring my energy with me.`],["Enigma",`Drives you to learn more – fear.`]]},
{id:"ivy",n:"Ivy",c:"#8e3b7a",h:"People lover – artist, model",q:"The ability to be yourself once in your life.",ph:["i161","With Kevin"],S:[["Why here",`People lover, sense of belonging, connects, communicative.`],["Creativity",`[[Dance]], artist, model. Beautiful to be recorded, unique – the ability to be yourself once in your life. Like a Subway Surfers power-up.`],["Why do you wear glasses",`See things clearly, capable. “Let me cook” – unique look – medical. [[Chose them to have…]]`],["Enigma",`Follows inspiring people (compares herself to others). What matters to me is my projection. Life is you – you are life.`],["Favourite drink",`Water – [[hydrating now]]. Smartwater – has a unique, different taste.`]]},
{id:"akash",n:"Akash",c:"#e08a00",h:"Filmmaker found on Instagram",q:"Loves creating – it makes him happy.",k:["Instagram: @casian_[[x.official]]"],ph:["i149","With Dhillon"],S:[["Why here",`Filmmaker – creative talent found on Instagram, loves that vibe. Wants to do film and theatre of culture. London Fashion Week: loves it, loves learning, missed it last time.`],["Creative vision",`Happy to promote – wants to add his input (not much on his ideas). Seems collaborative. Loves creating, it makes him happy.`],["Job opportunity",`Sees it as a job opportunity and has had his ideas stolen before. Talked a lot about the flow creatively, not his ideas. Not a copier – loves it.`]]},
{id:"jasim",n:"Jasim (J)",a:18,c:"#0b7285",h:"Ambitious and driven",q:"Pride only works when you’ve made it.",v:1,d:"0:33",S:[["Who are you",`Ambitious – opportunities – trust to deliver. Pulls through – become a somebody.`],["Why here",`Immigrated 1 year ago – worked on himself and his English – found himself.`],["Enigma",`Loves to put on a show – driven. Feels best suited: fashion and creativity, representation. Passionate and creative.`],["Love or Pride",`Pride only works when you’ve made it. When you love what you do, [[no output creates commitment]].`],["Favourite food",`Jollof, chicken, plantain – Nigerian.`]]}];
const W=["Good walk, [[but]] came with energy","Brings aura – confident walk. Hunched over? I like","Powerful walk – done this before","Very stiff but stable","I forgor 💀","Cool tattoos – confident – good walking pace; relaxed","Relaxed, confident","Good walk, confident","Aura? Confident walker – too fast","Good walk – frown? (like it)","Very quick – holds himself well","Shy? Stands tall!","Leaning back, arms confused","Model","Good walk, arms not feeling comfortable; muscly","Arm swinging – stiff!","Holding shoulders up – too tense","Face and walk good","Star power, energy","Walk has a lot of energy. Aura – like the shoulders","Left to right sway – confidence needed","Shoulder, powerful","Walks her own way","Not smooth, arms in pockets, good","Strutting – slow – frame for clothes","","","Arms doing whatever","Energy – very nice","Nice, a bit robotic, cool vibes"];
const K=[["Confident",/confiden/],["Energy",/energy|aura|star power/],["Powerful",/powerful/],["Relaxed",/relaxed/],["Stiff or tense",/stiff|tense/]];
const f=s=>s.replace(/\[\[(.+?)\]\]/g,'<span class="u">$1</span>');
const wc=(t,i)=>`<div class="w"><b>${i+7}</b><div><p>${t?f(t):"<i>I didn’t note this one</i>"}</p>${K.filter(k=>k[1].test(t)).map(k=>`<span class="ch">${k[0]}</span>`).join("")}</div></div>`;
let o=`<section class="pg cv"><img class="im" src="${I.i166}" alt=""><div class="bars">${P.map(p=>`<i style="background:${p.c}"></i>`).join("")}</div><div class="t"><h1>My casting call notes</h1><p>Hi! Here’s what I jotted down on the night: the ${P.length} lovely people I interviewed and the runway walks I watched.</p></div></section>`;
o+=`<section class="pg"><h2>Who I interviewed</h2><p style="color:var(--mut);margin:6px 0 0">A quick hello to everyone I got to chat with.</p><div class="gr">${P.map(p=>`<a class="cd" href="#${p.id}" style="--a:${p.c};--t:${p.t||"#fff"}"><b class="mo">${p.n[0]}</b><div><h3>${p.n}${p.a?`<small>${p.a}</small>`:""}</h3><p>${p.h}</p></div></a>`).join("")}</div></section>`;
P.forEach((p,i)=>{o+=`<section class="pg" id="${p.id}" style="--a:${p.c};--t:${p.t||"#fff"}"><div class="hd"><b class="mo">${p.n[0]}</b><div><h2>${p.n}</h2><p>${p.a?`<span class="ch">${p.a} yrs</span>`:""}${p.h}</p></div>${p.ph?`<figure class="pf"><img src="${I[p.ph[0]]}" alt="Photo"></figure>`:""}</div>${(p.k||[]).map(x=>`<p class="ct">${f(x)}</p>`).join("")}${p.S.map(s=>`<div class="s"><h4>${s[0]}</h4><p>${f(s[1])}</p></div>`).join("")}${p.col?`<div class="s"><h4>Favourite colour</h4><p class="sw"><i style="background:${p.col[1]}"></i>${p.col[0]}</p></div>`:""}<blockquote>${p.q}</blockquote>${p.v==1?`<div class="np vp"><button data-k="${p.id}">▶ Play voice note (${p.d})</button></div><p class="pn">🔊 ${p.n.split(" ")[0]} left a voice note (${p.d}) – <a href="${location.href.split("#")[0]}#${p.id}">tap here to listen online</a>.</p><div class="tr">Transcript: add text here.</div>`:p.v==2?`<p class="slot">🎙 Voice note – to be added</p><div class="tr">Transcript: add text here.</div>`:""}<em class="ft">${i+1} of ${P.length}</em></section>`});
const mx=Math.max(...K.map(k=>W.filter(w=>k[1].test(w)).length));
const bars=K.map(k=>{const n=W.filter(w=>k[1].test(w)).length;return`<div class="bar"><span>${k[0]}</span><u style="width:${n/mx*60}%"></u>${n}</div>`}).join("");
const G=[["i145","The gallery filling up"],["i150","By the gallery wall"],["i152","Posing in the corridor"],["i157","Airbrushing on the street outside"],["i166","Airbrushing a tote bag"],["i159","Catching up at a café table"],["i160","Laptop time on the red sofa"],["i164","Relaxing on the red bean bag"],["i147","Headphones and a phone by the lamp"],["i146","Mingling by the brick wall"],["i149","Dhillon and Akash"],["i161","Kevin and Ivy"]];
const gp=a=>a.map(g=>`<figure><img src="${I[g[0]]}" alt="${g[1]}"></figure>`).join("");
o+=`<section class="pg" style="--a:#14161b"><h2>The night in photos</h2><p style="color:var(--mut);margin:6px 0 0">A few of my favourite moments from the evening.</p><p class="al"><a href="https://photos.app.goo.gl/YJxWsNcyRiX7yxon7" target="_blank" rel="noopener">See the full photo album →</a> <small>photos.app.goo.gl/YJxWsNcyRiX7yxon7</small></p><div class="gl hero">${gp(G.slice(0,7))}</div></section><section class="pg" style="--a:#14161b"><div class="gl">${gp(G.slice(7))}</div><p class="al" style="margin-top:20px"><a href="https://photos.app.goo.gl/YJxWsNcyRiX7yxon7" target="_blank" rel="noopener">See the full photo album →</a> <small>photos.app.goo.gl/YJxWsNcyRiX7yxon7</small></p></section>`;
o+=`<section class="pg" style="--a:#2f5bff"><h2>The runway walks I watched</h2><div style="margin-top:12px"><p style="color:var(--mut);margin:0 0 6px">What I noticed most across the walks (walks 7–36)</p>${bars}</div><div class="wg">${W.slice(0,15).map(wc).join("")}</div></section><section class="pg" style="--a:#2f5bff"><div class="wg" style="margin-top:0">${W.slice(15).map((t,i)=>wc(t,i+15)).join("")}</div><p class="np slot" style="margin-top:24px">Unplaced note (screen only): “Male that got better”.</p></section>`;
document.getElementById("app").innerHTML=o;
const au={};document.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;if(!AU[k]){b.textContent="Voice note not available yet";return}let a=au[k];if(!a){a=au[k]=new Audio(AU[k]);a.onended=()=>b.textContent="▶ Play again"}if(a.paused){Object.values(au).forEach(x=>x.pause());a.play().then(()=>b.textContent="⏸ Pause").catch(()=>b.textContent="Couldn’t play – tap to retry")}else{a.pause();b.textContent="▶ Resume"}});
let on=false;document.getElementById("rv").onclick=function(){on=!on;document.body.classList.toggle("rv",on);this.textContent=on?"Done reviewing":"Review mode";document.querySelectorAll(".pg").forEach(e=>e.contentEditable=on)};
</script></body></html>
